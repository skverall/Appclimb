name: Deploy · Vercel Production

# Auto-deploy the production site (appclimb.app) on every push to main.
#
# Why this exists: the project's native Vercel ↔ GitHub integration is linked
# at the project level but its delivery webhook is not installed on this
# repository, so pushes to main were not triggering builds (the production site
# only moved on manual `vercel deploy`). This workflow is the reliable,
# self-contained replacement: GitHub itself fires it on push, and it deploys
# through the official Vercel CLI using repository secrets — no webhook and no
# private integration URL required.
#
# Required repository secrets (set once, never committed):
#   VERCEL_TOKEN       Vercel auth token with deploy access to the project
#   VERCEL_ORG_ID      Vercel team / org id (team_…)
#   VERCEL_PROJECT_ID  Vercel project id (prj_…)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: worker/go.mod
          cache-dependency-path: worker/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck -- --incremental false

      - name: Unit tests and coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: Go tests
        run: npm run worker:test

      - name: Go vet
        run: npm run worker:vet

  deploy:
    name: Build & deploy to appclimb.app
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Wait for the canonical sitemap
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error https://appclimb.app/sitemap.xml >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Notify IndexNow
        run: node scripts/submit-indexnow.mjs
