name: Deploy · Cloudflare Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, verify & deploy Cloudflare Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
      # Public build-time vars (inlined into the client bundle). Configure them
      # under GitHub → Settings → Secrets and variables → Actions → Variables.
      NEXT_PUBLIC_PRO_ENABLED: ${{ vars.NEXT_PUBLIC_PRO_ENABLED || '0' }}
      NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${{ vars.NEXT_PUBLIC_PADDLE_CLIENT_TOKEN || '' }}
      NEXT_PUBLIC_PADDLE_ENV: ${{ vars.NEXT_PUBLIC_PADDLE_ENV || 'sandbox' }}
      NEXT_PUBLIC_PADDLE_PRICE_PRO_MONTHLY: ${{ vars.NEXT_PUBLIC_PADDLE_PRICE_PRO_MONTHLY || '' }}
      NEXT_PUBLIC_PADDLE_PRICE_PRO_YEARLY: ${{ vars.NEXT_PUBLIC_PADDLE_PRICE_PRO_YEARLY || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fast safety net on main branch
      - name: Typecheck
        run: npm run typecheck -- --incremental false

      - name: Build for Cloudflare Workers
        run: npm run build:cloudflare

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply appclimb-db --remote

      - name: Deploy web Worker
        run: npx opennextjs-cloudflare deploy --env=''

      - name: Verify canonical homepage
        run: |
          curl --fail --silent --show-error https://appclimb.app/ \
            | grep -q "Popularity from Apple"

      - name: Wait for the canonical sitemap
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error https://appclimb.app/sitemap.xml >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Notify IndexNow
        run: node scripts/submit-indexnow.mjs
