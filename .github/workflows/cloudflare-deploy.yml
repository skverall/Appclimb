name: Deploy · Cloudflare Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  verify:
    name: Build release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fast safety net: catches merge oddities on main. The full suite
      # (lint, tests, coverage, API tests) runs in ci.yml on every pull request,
      # and branch protection requires it to pass before merge.
      - name: Typecheck
        run: npm run typecheck -- --incremental false

      - name: Build for Cloudflare Workers
        run: npm run build:cloudflare

      # Ship the exact artifact that was just built so deploy does not rebuild.
      # OpenNext output is deterministic (no build-time env inlining today).
      - name: Upload OpenNext build artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennext-build
          path: |
            .open-next
            .next
          retention-days: 1

  deploy:
    name: Deploy API, migrations, and web
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Reuse the verified build artifact instead of rebuilding it.
      - name: Download OpenNext build artifact
        uses: actions/download-artifact@v4
        with:
          name: opennext-build

      - name: Apply D1 migrations
        run: npm run cloudflare:d1:production

      - name: Deploy API Worker
        run: npm run deploy:cloudflare:api

      - name: Deploy web Worker
        run: npx opennextjs-cloudflare deploy --env=''

      - name: Verify API readiness
        run: curl --fail --silent --show-error https://appclimb-api.aydmaxx.workers.dev/readyz

      - name: Verify web-to-API service binding
        run: curl --fail --silent --show-error https://appclimb-web.aydmaxx.workers.dev/api/health

      - name: Verify canonical production health
        run: |
          curl --fail --silent --show-error https://appclimb.app/api/health \
            | jq --exit-status '
                .status == "ok"
                and .backend == "ready"
                and .backendOrigin == "https://appclimb-api.internal"
              '

      - name: Wait for the canonical sitemap
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error https://appclimb.app/sitemap.xml >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Notify IndexNow
        run: node scripts/submit-indexnow.mjs
